[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cosc520-advanced-ordered-sets"
version = "0.1.0"
description = "Reference implementation and reproducible benchmarks for AVL, treap, and splay trees"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
plots = ["matplotlib>=3.8,<4"]

[project.scripts]
tree-demo = "experiments.demo:main"
tree-benchmark = "experiments.benchmark:main"
tree-dataset = "experiments.dataset:main"
tree-plot = "experiments.plot:main"

[tool.setuptools.packages.find]
include = ["structures*", "experiments*", "configs*"]

[tool.setuptools.package-data]
configs = ["*.json"]
